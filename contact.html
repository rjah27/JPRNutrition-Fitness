<body>

            <h2 class="contact-header">
                Email:
            </h2>
            <p class="email">rjericho1227@gmail.com</p>
            <h2 class="contact-header">
                Phone Number:
            </h2>
            <p class="number">956-329-8578</p>
            
            <h2 class="contact-header">Send Feedback</h2>

    <script>
        document.querySelector("form").onsubmit=function(event){
            event.preventDefault();
            document.getElementById("confirmed").style.display = "block";
        };
    </script>
</body>
